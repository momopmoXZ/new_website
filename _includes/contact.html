<main class="contact-page">
	<section class="contact-panel">
		<div class="contact-panel__image">
			<img src="{{ '/assets/images/engaging_photos/DSC3385.jpg' | relative_url }}" alt="Students cheering around a robot at a Unibots event">
			<div class="contact-panel__image-copy">
				<p>Unibots UK</p>
				<strong>Let’s build something brilliant together.</strong>
			</div>
		</div>

		<div class="contact-panel__content">
			<p class="contact-label">Get in touch</p>
			<h1>Contact us</h1>
			<p class="contact-intro">
				Have a question about competing, volunteering, or supporting Unibots? Send us a message
				and a member of the team will get back to you.
			</p>

			<form class="contact-form" action="https://api.staticforms.dev/submit" method="POST" data-contact-form>
				<input type="hidden" name="apiKey" value="sf_71d45b09aa261d0a32cadb0d">

				<div class="contact-form__field">
					<label for="contact-email">Email address</label>
					<input id="contact-email" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
				</div>

				<div class="contact-form__field">
					<label for="contact-message">How can we help?</label>
					<textarea id="contact-message" name="message" rows="7" placeholder="Write your message here…" required></textarea>
				</div>

				<button class="contact-form__submit" type="submit">Send message</button>
				<p class="contact-form__status" data-contact-status role="status" aria-live="polite"></p>
			</form>
		</div>
	</section>
</main>
